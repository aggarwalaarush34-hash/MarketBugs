[project]
name = "marketdebug"
version = "0.1.0"
description = "Market-based multi-agent debugging with trading, information and repair rewards"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "numpy>=1.26"]
live = ["requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketdebug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
